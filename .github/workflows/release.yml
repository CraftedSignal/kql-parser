name: release

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-test:
    name: Validate test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  validate-lint:
    name: Validate lint
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate-security:
    name: Validate security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  release:
    needs: [validate-test, validate-lint, validate-security]
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Get Go version
        id: vars
        run: |
          goVersion=$(grep '^FROM go' .github/go/Dockerfile | cut -d ' ' -f 2 | cut -d ':' -f 2)
          echo "go_version=${goVersion}" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.vars.outputs.go_version }}
          cache: false

      - name: Semantic Release
        id: semver
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          changelog-generator-opt: "emojis=true"
          allow-initial-development-versions: true
